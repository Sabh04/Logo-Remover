name: Build LogoRemover

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build-windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm logo-remover.spec

      - name: Self-test the BUILT app (engine + send2trash + Tk)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\LogoRemover\LogoRemover.exe" `
                 -ArgumentList "--selftest", "`"$result`"" -Wait -PassThru
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Built app self-test FAILED (exit code $($p.ExitCode))" }

      - name: Zip Windows build
        run: Compress-Archive -Path dist/LogoRemover/* -DestinationPath LogoRemover-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: LogoRemover-windows
          path: LogoRemover-windows.zip

  build-macos:
    name: macOS build (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1/M2/M3/M4)
            arch: apple-silicon
          - runner: macos-15-intel    # Intel Macs
            arch: intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt pyinstaller

      - name: Unit tests on macOS
        run: python3 -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm logo-remover.spec

      - name: Ad-hoc sign (required for Apple Silicon to launch the app)
        run: |
          codesign --force --deep --sign - dist/LogoRemover.app
          codesign --verify --deep --strict dist/LogoRemover.app
          lipo -archs dist/LogoRemover.app/Contents/MacOS/LogoRemover

      - name: Self-test the BUILT app (engine + send2trash + Tk)
        run: |
          result="$RUNNER_TEMP/selftest.txt"
          set +e
          dist/LogoRemover.app/Contents/MacOS/LogoRemover --selftest "$result"
          code=$?
          [ -f "$result" ] && cat "$result"
          if [ $code -ne 0 ]; then echo "Built app self-test FAILED (exit code $code)"; exit 1; fi

      - name: Create DMG (drag-to-Applications layout)
        run: |
          mkdir dmg
          cp -R dist/LogoRemover.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname LogoRemover -srcfolder dmg -ov -format UDZO "LogoRemover-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: LogoRemover-mac-${{ matrix.arch }}
          path: LogoRemover-${{ matrix.arch }}.dmg
